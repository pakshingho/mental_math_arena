name: Deploy PR preview to GitHub Pages

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  deployments: write
  issues: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        if: github.event.action != 'closed'
        uses: actions/checkout@v4

      - name: Prepare static site
        if: github.event.action != 'closed'
        run: |
          mkdir -p preview-site
          cp index.html styles.css app.js manifest.json sw.js icon.svg preview-site/
          touch preview-site/.nojekyll

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./preview-site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: https://pakshingho.github.io/mental_math_arena/
          action: auto
          wait-for-pages-deployment: true
          comment: true
          qr-code: false
          deploy-commit-message: Deploy preview for PR ${{ github.event.number }}
          remove-commit-message: Remove preview for PR ${{ github.event.number }}
