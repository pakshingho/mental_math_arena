name: Deploy production site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-production"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p preview-site
          cp index.html styles.css app.js manifest.json sw.js icon.svg preview-site/
          touch preview-site/.nojekyll

      - name: Deploy production site
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: preview-site
          clean: true
          clean-exclude: pr-preview/
          force: false
          commit-message: Deploy production site
